name: goldens

# One-off helper: regenerate Linux pixel goldens where the lab can
# really connect (runners have a working TUN path). Dispatch manually,
# download the `goldens` artifact, commit the PNGs, delete this file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev > /dev/null
      - name: lab binaries (harness needs a real backend + core)
        env:
          SINGBOX_VERSION: 1.14.1
        run: |
          mkdir -p ~/.local/share/connective/lab-bin
          (cd backend && go build -o ~/.local/share/connective/lab-bin/connectived ./cmd/connectived)
          curl -sL -o /tmp/sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          mkdir -p ~/.local/share/connective/lab-bin/sing-box-${SINGBOX_VERSION}-linux-amd64
          tar -xzf /tmp/sb.tar.gz -C ~/.local/share/connective/lab-bin/sing-box-${SINGBOX_VERSION}-linux-amd64 \
            --strip-components=1
      - name: regenerate goldens
        working-directory: frontend
        run: |
          flutter pub get
          flutter test --update-goldens test/golden_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: frontend/test/goldens/*.png
