name: ci

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt check
        run: |
          out=$(gofmt -l backend/)
          test -z "$out" || { echo "unformatted: $out"; exit 1; }
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: test
        working-directory: backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: analyze
        working-directory: frontend
        run: |
          flutter pub get
          # Infos only (pre-existing tray deprecations): never fail CI.
          flutter analyze --no-fatal-infos
      - name: test
        working-directory: frontend
        run: flutter test
